# Version-proof stack for Odoo 17 / 18 (Odoo 19 keeps its own project in odoo.compose.yaml, untouched).
# Mirrors odoo.compose.yaml isolation: own Postgres, internal-only private network, project-scoped volumes,
# a single nginx ingress bound to 127.0.0.1. Driven by scripts/odoo_version_proof.sh, which sets:
#   ODOO_VERSION (17|18), ODOO_IMAGE (digest-pinned), ODOO_PORT (127.0.0.1 web port). Project name: pennbridge-odoo<ver>.
name: pennbridge-odoo${ODOO_VERSION:?set ODOO_VERSION}
services:
  odoo-db:
    image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: pennbridge
      POSTGRES_PASSWORD: pennbridge-local-db-only
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks: [odoo-private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pennbridge -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
  odoo:
    image: ${ODOO_IMAGE:?set ODOO_IMAGE}
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: pennbridge
      PASSWORD: pennbridge-local-db-only
    command: [odoo, --database=pennbridge, --without-demo=all]
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./odoo:/mnt/proof:ro
      - ../fixtures/scale:/mnt/fixtures-scale:ro
    networks: [odoo-private]
  odoo-web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on: [odoo]
    ports: ['127.0.0.1:${ODOO_PORT:?set ODOO_PORT}:80']
    volumes:
      - ./odoo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [odoo-private, odoo-ingress]
networks:
  odoo-ingress: {}
  odoo-private:
    internal: true
volumes:
  odoo-db-data:
  odoo-data:
