# Test-only Dovecot for scripts/test_mailbox_oauth.sh. IMAPS with a generated test CA, passwd-file (app password) and an
# oauth2 passdb that validates XOAUTH2/OAUTHBEARER tokens by POSTing them to the local mock introspection endpoint.
dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3
log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout
protocols = imap
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail
state_dir = /run/dovecot
auth_verbose = yes
auth_mechanisms = plain login xoauth2
mail_driver = maildir
mail_path = ~/Maildir
mail_home = /srv/vmail/%{user}
mail_uid = vmail
mail_gid = vmail
ssl = required
ssl_server {
  cert_file = /tls/server.crt
  key_file = /tls/server.key
}
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
  }
}
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
oauth2_introspection_mode = post
oauth2_introspection_url = http://mock.pb-test:8080/introspect
oauth2_force_introspection = yes
oauth2_active_attribute = active
oauth2_active_value = true
oauth2_username_attribute = email

passdb oauth2 {
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/vmail/%{user}
  }
}
