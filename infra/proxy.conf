# Demo proxy (plain HTTP, loopback only). Production uses Caddy: infra/compose.prod.yaml.
events {}
http {
  # Docker's embedded DNS, re-queried every 10 s, so recreating `app` (new IP) never leaves nginx on a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 3087;
    client_max_body_size 15m;
    server_tokens off;
    location / {
      set $app_upstream http://app:3087;
      proxy_pass $app_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Replace, never append: this proxy is the edge, so a client-supplied X-Forwarded-For must not survive (login throttling keys on it).
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 90s;
    }
  }
  server {
    listen 8027;
    server_tokens off;
    location / { set $mail_upstream http://mailpit:8025; proxy_pass $mail_upstream; proxy_set_header Host $http_host; }
  }
}
